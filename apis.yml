name: Element AI
description: >-
  Element AI was a Montreal, Quebec-based artificial intelligence company founded in 2016 by
  Jean-Francois Gagne, Yoshua Bengio, Nicolas Chapados, Philippe Beaudoin, Anne Martel, and
  Jean-Sebastien Cournoyer. It operated as an AI systems integrator and professional-services
  firm with the mission of putting advanced AI capabilities - natural language processing,
  computer vision, document intelligence, and conversational AI - in reach of traditional
  enterprises. After raising roughly US$102M plus Canadian government funding and reaching an
  estimated US$600-700M valuation in 2019, the company ran short of runway and was acquired by
  ServiceNow (announced November 30, 2020; closed January 8, 2021 for approximately US$230M).
  Its research group became ServiceNow Research and its former domain now redirects there. The
  company no longer operates independently and publishes no standalone public API, developer
  portal, or SDKs.
